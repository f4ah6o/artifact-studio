<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Artifact Studio</strong>
      <span id="adapter-description" class="subtle">BPMN</span>
      <label class="adapter-picker">
        <span class="sr-only">Artifact adapter</span>
        <select id="adapter-select" aria-label="Artifact adapter"></select>
      </label>
    </div>
    <div class="actions">
      <span id="codex-state" class="subtle">Codex確認中…</span>
      <button id="codex-login-button" class="button secondary" type="button" hidden>ChatGPTに接続</button>
      <label id="file-open-label" class="button secondary" for="file-input">ファイルを開く</label>
      <input id="file-input" type="file" hidden>
      <button id="validate-button" class="button secondary" type="button">検証</button>
      <button id="format-button" class="button secondary" type="button" disabled>整形</button>
      <button id="export-button" class="button secondary" type="button" disabled>書き出す</button>
    </div>
  </header>

  <section class="promptbar">
    <textarea id="process-prompt" rows="2"></textarea>
    <button id="generate-button" class="button primary" type="button">AIで生成</button>
  </section>

  <main class="workspace">
    <section class="diagram-pane">
      <div id="canvas" class="artifact-view" aria-label="BPMN modeler"></div>

      <div id="mermaid-pane" class="artifact-view mermaid-pane hidden" aria-label="Mermaid editor">
        <section class="source-pane">
          <div class="artifact-pane-heading">Mermaid source</div>
          <textarea id="mermaid-source" class="source-editor" spellcheck="false" placeholder="flowchart TD&#10;  A[開始] --> B[完了]"></textarea>
        </section>
        <section class="preview-pane">
          <div class="artifact-pane-heading">Preview</div>
          <div id="mermaid-preview" class="mermaid-preview">
            <span class="muted">Mermaidソースを入力またはAI生成してください。</span>
          </div>
        </section>
      </div>

      <div id="empty-state" class="empty-state">
        <strong>プロセスを記述して生成</strong>
        <span>または既存の .bpmn を開いて編集できます。</span>
      </div>
      <div id="status" class="status">初期化中…</div>
    </section>

    <aside class="sidebar">
      <section class="panel selected-panel">
        <div id="selected-heading" class="panel-heading">選択中</div>
        <div id="selected-element" class="muted">BPMN要素を選択してください。</div>
      </section>

      <section class="panel findings-panel">
        <div class="panel-heading row">
          <span>検出事項</span>
          <span id="finding-count" class="count">0</span>
        </div>
        <div id="findings" class="findings">
          <div class="muted">検証結果はここに表示されます。</div>
        </div>
      </section>

      <section class="panel ai-panel">
        <div class="panel-heading row">
          <span>AIレビュー</span>
          <button id="review-button" class="link-button" type="button">現在のartifactをレビュー</button>
        </div>
        <div id="chat-log" class="chat-log">
          <div class="assistant-message">artifactを作成した後、「現在のartifactをレビュー」で未定義事項や改善点を確認できます。</div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="2" placeholder="この図の改善点は？"></textarea>
          <button class="button primary" type="submit">送信</button>
        </form>
      </section>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
