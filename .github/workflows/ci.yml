name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          working-directory: scripts
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: true

      - name: Check
        working-directory: scripts
        run: vp check

      - name: Test
        working-directory: scripts
        run: vp test --run

      - name: Build frontend
        working-directory: scripts
        run: vp build

      - name: Smoke test — generate BPMN + SVG
        working-directory: scripts
        run: node pipeline.js ../tests/fixtures/simple-approval.json /tmp/smoke-test
