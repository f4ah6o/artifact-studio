name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calver-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24
          cache: true
          run-install: true

      - name: Allocate CalVer
        id: calver
        uses: f4ah6o/calver-action@d52d460544cb0174c02020dcfae3f73b334fb3a8
        with:
          format: YYYY.MM.PATCH
          timezone: Asia/Tokyo
          create_tag: false

      - name: Set package version
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.version = process.env.VERSION;
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Check
        run: vp check

      - name: Test
        run: vp test --run

      - name: Build frontend
        run: vp build

      - name: Create release-only commit
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${VERSION}"
          fi

      - name: Push immutable CalVer tag
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/${TAG}"

      - name: Summary
        env:
          VERSION: ${{ steps.calver.outputs.version }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          {
            echo "## Artifact Studio release"
            echo
            echo "- version: `${VERSION}`"
            echo "- tag: `${TAG}`"
            echo "- format: `YYYY.M.PATCH`"
            echo "- timezone: `Asia/Tokyo`"
          } >> "$GITHUB_STEP_SUMMARY"
